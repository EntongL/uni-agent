# Run this command from the uni-agent repository root. Ray uploads this
# working directory to the job workers, including the local uni_agent package.
working_dir: ./
excludes:
  - "/.git/"

# Do not add a pip section here. Ray would clone the complete NPU Python
# environment, including large torch libraries, into /tmp and can exhaust the
# local disk. Install any missing package in the base NPU venv instead.

env_vars:
  # The repository's verl checkout is expected under the Ray working dir, or
  # verl must already be importable in the NPU image.
  PYTHONPATH: "verl"
  # Force verl's platform detector to use the built-in Huawei/Ascend backend.
  # Without this, a CUDA-capable torch installation can make the Ray worker
  # group request GPU resources even though trainer.device=npu is configured.
  VERL_PLATFORM: "huawei"
  DEVICE: "npu"
  # Let Ray set one physical NPU per actor. Setting this to 1 makes the
  # current verl worker path derive LOCAL_RANK from the whole visibility list.
  RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES: "0"
  PYTHONNOUSERSITE: "1"
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  VLLM_DISABLE_COMPILE_CACHE: "1"
