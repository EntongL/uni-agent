# AscendKernelBench's parquet rows supply the canonical sandbox image and task
# metadata. This recipe owns the resident-container attachment and Claude Code
# workflow. Set the three container paths below to match the prepared image.
- name: triton_op_generator
  sandbox:
    provider: docker
    runtime_timeout: 7200
    sandbox_kwargs:
      container_ref: uni-agent-resident
      # The dataset's canonical image name need not be a local Docker tag for
      # this externally managed resident container.
      verify_container_image: false
      # Optional cross-host SSH tunnel. The rollout container starts one
      # reverse tunnel per Gateway session and rewrites Claude's endpoint to
      # 127.0.0.1:<allocated-port> inside the host-networked resident.
      # ssh_reverse_tunnel:
      #   ssh_host: <atlas-41-address>
      #   ssh_user: root
      #   remote_port: 0
      #   identity_file: /root/.ssh/id_ed25519
      #   known_hosts_file: /root/.ssh/known_hosts

  agent_workdir: /mnt/model/lientong/AscendKernelBench/agent
  episode_root: /tmp/uni-agent-triton-episodes
  kernelgym_url: http://10.1.30.41:19001
  kernelgym_toolkit: sandbox_v3
  kernelgym_backend: triton
  entry_point: Model
  correctness_trials: 3
  performance_trials: 10
  evaluation_timeout: 900
  evaluation_poll_interval: 2
  cleanup_episode: true
  # A clean CLI exit without output/kernel_code.py is not task completion.
  # Resume the same Claude conversation once with an artifact-focused prompt.
  missing_kernel_retries: 1

  agent:
    name: claude_code
    # AscendKernelBench's triton-ascend-kernelgen workflow is implemented as
    # Claude Code skills, so this must remain false.
    disable_slash_commands: false
    enable_subagents: false
    # The resident container defaults to root. Claude Code blocks its broad
    # bypassPermissions mode as root, so pre-approve this workflow's tool set
    # and reject any other tool without an interactive prompt.
    permission_mode: dontAsk
    allowed_tools:
      - Bash
      - Read
      - Edit
      - Write
      - Glob
      - Grep
    # Temporary Gateway smoke diagnostics. Remove or disable these for large
    # RL runs after the model/parser combination is verified.
    verbose: true
    extra_args:
      - --debug-file
      - /tmp/uni-agent-claude-debug.log
    max_turns: 32
    run_timeout: 3600
    extra_env:
      KERNELGYM_SERVER_URL: http://10.1.30.41:19001
      KERNELGYM_TOOLKIT: sandbox_v3
      MAX_SMOKE: "2"
      MAX_TURNS: "32"
      # Match the actual --model-path, not the glm-5.2 served-model alias.
      # Qwen3-0.6B has max_position_embeddings=40960. A fake 1M window
      # prevents Claude Code from compacting before the backend runs out.
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "40960"
      # Reserve more of the 40K checkpoint's context for the prompt, tool schemas,
      # and the kernelgen skills. Increase only for checkpoints with larger windows.
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: "4096"
      # Prevent one large skill/reference Read from refilling the context at once.
      CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS: "4096"
      # Retain Claude Code's tools and skills while reducing system/tool-schema tokens.
      CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT: "1"
    model:
      temperature: 0.7
      top_p: 0.8
      max_total_tokens: 32768

  prompt_template:
    - role: user
      content: |-
        Generate a correct Ascend Triton implementation for the following PyTorch operator.
        Preserve the reference Model interface and behavior. The implementation must
        define Model in OUTPUT_DIR/kernel_code.py.
        Create the final file before ending the session. A plan or sketch alone is
        not a completed task; after each design step, continue through coding and
        confirm OUTPUT_DIR/kernel_code.py exists.

        Reference implementation:
        {operator_src}

        Work from the runtime REFERENCE_PATH and OUTPUT_DIR supplied below. Start
        with the installed triton-ascend-kernelgen workflow and load sibling skills
        only when that workflow needs them. Do not preload or reread every skill;
        inspect long references in small sections and keep command output bounded.
        Prefer Read/Edit/Write for file work; use Bash only when the workflow requires it.
        Keep the reference immutable and write all generated artifacts under OUTPUT_DIR.
        Use KernelGYM for evaluation. Do not run verify.py or benchmark.py.
